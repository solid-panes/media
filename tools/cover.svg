<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Cover art for samples/arpeggio.*: the eight notes of the arpeggio as rising bars. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b7bf0"/>
      <stop offset=".55" stop-color="#6a4fe0"/>
      <stop offset="1" stop-color="#c04fb4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".25" cy=".2" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#glow)"/>
  <circle cx="232" cy="74" r="38" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="10"/>
  <g fill="#fff">
    <rect x="38"  y="196" width="20" height="62"  rx="10" fill-opacity=".92"/>
    <rect x="68"  y="170" width="20" height="88"  rx="10" fill-opacity=".92"/>
