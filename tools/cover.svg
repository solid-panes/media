    <rect x="128" y="104" width="20" height="154" rx="10"/>
    <rect x="158" y="146" width="20" height="112" rx="10" fill-opacity=".92"/>
    <rect x="188" y="170" width="20" height="88"  rx="10" fill-opacity=".92"/>
    <rect x="218" y="196" width="20" height="62"  rx="10" fill-opacity=".92"/>
    <rect x="248" y="216" width="20" height="42"  rx="10" fill-opacity=".8"/>
