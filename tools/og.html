<!doctype html>
<!-- The picture shown when a link to solid-panes.github.io/media is shared (og.png, 1200 × 630).
     node tools/og.mjs serves this folder's parent and renders this page to ../og.png. The card on
     the right is the real pane playing samples/test-pattern.mp4. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Atkinson'; font-weight: 100 900; src: url('atkinson.woff2') format('woff2') }
  * { box-sizing: border-box; margin: 0 }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Atkinson', system-ui, sans-serif; color: #fff;
    background:
      radial-gradient(900px 520px at 88% 12%, rgba(47, 111, 222, .55), transparent 62%),
      radial-gradient(700px 500px at 4% 104%, rgba(124, 77, 255, .25), transparent 60%),
      linear-gradient(135deg, #0b1220 0%, #12203a 55%, #1a1a40 100%) }
  .grid { position: absolute; inset: 0; opacity: .18;
    background-image: linear-gradient(rgba(255,255,255,.09) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.09) 1px, transparent 1px);
    background-size: 48px 48px; mask-image: radial-gradient(900px 500px at 70% 40%, #000, transparent 75%) }
  .left { position: absolute; left: 64px; top: 66px; width: 440px }
  .brand { display: flex; align-items: center; gap: 20px }
  .brand img { width: 92px; height: 85px; filter: drop-shadow(0 10px 30px rgba(47, 111, 222, .65)) }
  .brand b { font-size: 88px; font-weight: 800; letter-spacing: -.035em; line-height: 1 }
  .pill { display: inline-block; margin-top: 26px; font-size: 26px; font-weight: 700; padding: 6px 20px; border-radius: 999px; background: #2f6fde; letter-spacing: .02em }
  h1 { margin-top: 20px; font-size: 48px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; text-wrap: balance }
  h1 em { font-style: normal; color: #8fc1ff }
  p { margin-top: 20px; font-size: 26px; line-height: 1.35; color: #c3cde0; max-width: 430px }
  .tags { position: absolute; left: 64px; bottom: 58px; display: flex; gap: 12px }
  .tags span { font-size: 20px; font-weight: 600; padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.16); color: #dbe3f3 }

  .win { position: absolute; left: 532px; top: 96px; width: 636px; height: auto; border-radius: 22px; overflow: hidden;
    background: #fff; box-shadow: 0 40px 90px rgba(3, 6, 20, .65), 0 0 0 1px rgba(255,255,255,.14); transform: rotate(-1.6deg) }
  .bar { height: 60px; background: #1d293d; display: flex; align-items: center; gap: 14px; padding: 0 18px }
  .bar img { width: 36px; height: 33px }
  .addr { flex: 1; height: 40px; border-radius: 999px; background: #fff; display: flex; align-items: center; padding: 0 16px; gap: 10px; box-shadow: 0 0 0 3px #7fa8f0 }
  .addr i { width: 16px; height: 16px; border-radius: 50%; border: 2.2px solid #62748e }
  .addr span { flex: 1; color: #0f172b; font-size: 18px; white-space: nowrap; overflow: hidden }
  .addr span b { color: #2f6fde; font-weight: 800 }
  #pane .mdp { padding: 14px }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="left">
    <div class="brand"><img src="og-emblem.svg" alt=""><b>media</b></div>
    <div class="pill">a SolidOS pane</div>
    <h1>Video, sound and pictures, <em>played in place</em></h1>
    <p>The browser's own player, with the file's name, size and type.</p>
  </div>
  <div class="tags"><span>one file</span><span>read-only</span><span>loaded by link</span></div>

  <div class="win">
    <div class="bar">
      <img src="og-emblem.svg" alt="">
      <div class="addr"><i></i><span>…/browser/<b>?pane=</b>…/media-pane.js</span></div>
    </div>
    <div id="pane"></div>
  </div>
<script type="module">
  // the pane, given just what it needs: a document node and a fetch
  const pane = (await import('../media-pane.js')).default
  const uri = new URL('../samples/test-pattern.mp4', location.href).href
  const subject = { termType: 'NamedNode', value: uri, uri, doc () { return this } }
  const context = { dom: document, session: { store: { fetcher: { _fetch: fetch.bind(globalThis) } } } }
  document.getElementById('pane').appendChild(pane.render(subject, context))
  const v = document.querySelector('video')
  // show a frame from the middle of the clip
  v.addEventListener('loadedmetadata', () => { v.currentTime = 3.2 }, { once: true })
  v.addEventListener('seeked', () => document.body.classList.add('ready'), { once: true })
</script>
</body>
</html>
